server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tpv_auth?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci}
    username: ${DB_USERNAME:tpv_user}
    password: ${DB_PASSWORD:tpv_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      indent_output: true

app:
  jwt:
    secret: ${JWT_SECRET:1234567890123456789012345678901234567890123456789012345678901234}
    issuer: ${JWT_ISSUER:tpv-auth-service}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
