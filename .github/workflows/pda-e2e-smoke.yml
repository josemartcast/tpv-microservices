name: PDA E2E Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "0 4 * * *"

jobs:
  pda-e2e-smoke:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend + smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          chmod +x services/auth-service/mvnw services/pos-service/mvnw gateway/mvnw

          cleanup() {
            set +e
            if [ -f .ci-logs/auth-service.pid ]; then kill "$(cat .ci-logs/auth-service.pid)" >/dev/null 2>&1 || true; fi
            if [ -f .ci-logs/pos-service.pid ]; then kill "$(cat .ci-logs/pos-service.pid)" >/dev/null 2>&1 || true; fi
            if [ -f .ci-logs/gateway.pid ]; then kill "$(cat .ci-logs/gateway.pid)" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT

          (
            cd services/auth-service
            DB_URL='jdbc:mysql://127.0.0.1:3306/tpv_auth?createDatabaseIfNotExist=true' \
            DB_USERNAME='root' \
            DB_PASSWORD='root' \
            JWT_SECRET='1234567890123456789012345678901234567890123456789012345678901234' \
            ./mvnw -q -DskipTests spring-boot:run
          ) > .ci-logs/auth-service.log 2>&1 &
          echo $! > .ci-logs/auth-service.pid

          (
            cd services/pos-service
            DB_URL='jdbc:mysql://127.0.0.1:3306/tpv_pos?createDatabaseIfNotExist=true' \
            DB_USERNAME='root' \
            DB_PASSWORD='root' \
            JWT_SECRET='1234567890123456789012345678901234567890123456789012345678901234' \
            ./mvnw -q -DskipTests spring-boot:run
          ) > .ci-logs/pos-service.log 2>&1 &
          echo $! > .ci-logs/pos-service.pid

          (
            cd gateway
            AUTH_SERVICE_URI='http://127.0.0.1:8081' \
            POS_SERVICE_URI='http://127.0.0.1:8082' \
            JWT_SECRET='1234567890123456789012345678901234567890123456789012345678901234' \
            ./mvnw -q -DskipTests spring-boot:run
          ) > .ci-logs/gateway.log 2>&1 &
          echo $! > .ci-logs/gateway.pid

          wait_for_port() {
            local name="$1"
            local port="$2"
            local pid_file="$3"
            local log_file="$4"

            echo "Waiting for $name on port $port..."
            for _ in $(seq 1 300); do
              if timeout 1 bash -c "</dev/tcp/127.0.0.1/$port" >/dev/null 2>&1; then
                echo "Port $port is up ($name)"
                return 0
              fi

              if [ -f "$pid_file" ]; then
                local pid
                pid="$(cat "$pid_file")"
                if ! kill -0 "$pid" >/dev/null 2>&1; then
                  echo "$name process exited before opening port $port"
                  echo "=== $log_file (tail) ==="
                  tail -n 400 "$log_file" || true
                  return 1
                fi
              fi
              sleep 1
            done

            echo "Port $port did not open in time ($name)"
            echo "=== $log_file (tail) ==="
            tail -n 400 "$log_file" || true
            return 1
          }

          wait_for_port "auth-service" 8081 ".ci-logs/auth-service.pid" ".ci-logs/auth-service.log"
          wait_for_port "pos-service" 8082 ".ci-logs/pos-service.pid" ".ci-logs/pos-service.log"
          wait_for_port "gateway" 8080 ".ci-logs/gateway.pid" ".ci-logs/gateway.log"

          pwsh -NoProfile -File ./scripts/pda-e2e-smoke.ps1 \
            -GatewayBaseUrl "http://127.0.0.1:8080" \
            -Username "admin" \
            -Password "admin123" \
            -TerminalA "CI-A" \
            -TerminalB "CI-B"

      - name: Print logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "=== auth-service.log ==="
          tail -n 300 .ci-logs/auth-service.log || true
          echo "=== pos-service.log ==="
          tail -n 300 .ci-logs/pos-service.log || true
          echo "=== gateway.log ==="
          tail -n 300 .ci-logs/gateway.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pda-e2e-logs
          path: .ci-logs/
          if-no-files-found: ignore
